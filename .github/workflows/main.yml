name: Application Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            echo "[1/7] Checking application directory..."
            cd "${{ secrets.APPLICATION_PATH }}"
            echo "Application directory exists"

            echo "[2/7] Checking Git status..."
            git config --global --add safe.directory "${{ secrets.APPLICATION_PATH }}"
            git status --short

            echo "[3/7] Updating application..."
            git pull origin main
            echo "Git update completed"

            echo "[4/7] Activating Python virtual environment..."
            source venv/bin/activate
            echo "Python: $(which python)"
            python --version

            echo "[5/7] Installing Python dependencies..."
            python -m pip install -r requirements.txt
            echo "Dependencies installed"

            echo "[6/7] Running database migrations..."
            python scripts/migrate.py
            echo "Database migrations completed"

            echo "[7/7] Restarting application..."
            sudo -n systemctl restart tournamenthub

            echo "Checking service status..."
            systemctl is-active --quiet tournamenthub
            echo "Service is running"

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"