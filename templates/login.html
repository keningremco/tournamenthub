{% extends 'template.html' %}

{% block header %}
Login
{% endblock %}

{% block style %}

<style>
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
    }

    .form-group label {
        font-weight: 500;
    }

    .form-group input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
        width: 100%;
    }

    .form-group input:focus {
        outline: none;
        border-color: #555;
    }

    .login-error {
        color: #d32f2f;
        margin: 10px 0;
    }

    form {
        max-width: 500px;
        margin: 0 auto;
    }

    form > a {
        display: block;
        margin-top: 12px;
    }
</style>

{% endblock %}

{% block main %}

<form method="POST">

<div class="form-group">
    <label for="username">Username</label>

    <input
        type="text"
        name="username"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
    >
</div>

<div class="form-group">
    <label for="password">Password</label>

    <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
    >
</div>

{% if error %}
    <p class="login-error">{{ error }}</p>
{% endif %}

<button class="button-link primary" type="submit">
    Login
</button>

<a href="{{ url_for('signup') }}">Create an account</a>
<a href="{{ url_for('forgot_password') }}">Forgot password?</a>

</form>

{% endblock %}
