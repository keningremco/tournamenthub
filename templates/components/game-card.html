{% macro game_card(game) %}
<div class="game">

    <div class="team">
        {{ game.home_team }}
    </div>

    <div class="game-score">
        {{ game.home_score }} - {{ game.away_score }}
    </div>

    <div class="team">
        {{ game.away_team }}
    </div>

    <div class="game-info">
        {{ game.info }}
    </div>

</div>
{% endmacro %}
