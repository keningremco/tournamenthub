{% from 'components/game-card.html' import game_card %}
{% macro round(games, name, id) %}
    <div class="section" id="{{ id }}">
        <h1>{{ name }}</h1>
        <div class="round">
        {% for game in games %}
            {{ game_card(game) }}
        {% endfor %}
        </div>

    </div>
{% endmacro %}
