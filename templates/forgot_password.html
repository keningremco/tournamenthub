{% extends 'template.html' %}

{% block header %}
Forgot Password
{% endblock %}

{% block style %}

<style>
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
    }

    .form-group label {
        font-weight: 500;
    }

    .form-group input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
        width: 100%;
    }

    .form-group input:focus {
        outline: none;
        border-color: #555;
    }

    .forgot-password-error {
        color: #d32f2f;
        margin: 10px 0;
    }

    form {
        max-width: 500px;
        margin: 0 auto;
    }

    form > a {
        display: block;
        margin-top: 12px;
    }
</style>

{% endblock %}

{% block main %}

<form method="POST">

<div class="form-group">
    <label for="email">Email</label>

    <input
        type="email"
        name="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
    >
</div>

{% if error %}
    <p class="forgot-password-error">{{ error }}</p>
{% endif %}

<button class="button-link primary" type="submit">
    Send reset link
</button>

<a href="{{ url_for('login') }}">Back to login</a>

</form>

{% endblock %}
