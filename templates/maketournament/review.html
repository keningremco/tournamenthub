<!-- =====================================================
     STEP 7 — REVIEW
     ===================================================== -->

<div class="page" data-page="7">

    <div class="card">

        <h2>Review</h2>

        <p class="card-description">
            Check everything before creating your tournament.
        </p>


        <div id="review"></div>

    </div>


    <div class="card">

        <h2>Create tournament</h2>

        <p class="card-description">
            Your choice from the first page is selected automatically,
            but you can still change it here.
        </p>


        <div class="final-actions">

            <button
                type="submit"
                name="action"
                value="manual"
                id="manualButton"
                class="button manual"
            >
                Create manually

                <span class="final-description">
                    No matches will be generated.
                </span>

            </button>


            <button
                type="submit"
                name="action"
                value="generate"
                id="generateButton"
                class="button generate"
            >
                Generate tournament

                <span class="final-description">
                    Generate matches automatically.
                </span>

            </button>

        </div>

    </div>


    <div class="navigation">

        <button
            type="button"
            class="button back"
            onclick="previousStep()"
        >
            ← Back
        </button>

    </div>

</div>
