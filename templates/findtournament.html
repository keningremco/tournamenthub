{% extends 'template.html' %}

{% block header %}
    Find a tournament by entering the tournament code
{% endblock %}

{% block style %}
<style>
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 700px;
    }

    input,
    button {
        padding: 10px;
        font-size: 16px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
    }

    .search-row {
        display: flex;
        gap: 8px;
    }

    button {
        white-space: nowrap;
        cursor: pointer;
    }

    .error {
        color: red;
    }

    @media (max-width: 600px) {
        .search-row {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block main %}
<form action="/findtournament" method="post">

    <label for="code">Tournament code</label>

    <div class="search-row">
        <input
            type="text"
            name="code"
            id="code"
            placeholder="Enter tournament code..."
            autocomplete="off"
            required
        >

        <button type="submit">Search</button>
    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</form>
{% endblock %}
